[project]
name = "tok-cnt"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "tiktoken>=0.14.0",
    "typer>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]

[project.scripts]
tok-cnt = "main:app"
